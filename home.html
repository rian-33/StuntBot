<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>StuntBot – Home</title>
  <style>
    body{font-family:Arial,sans-serif;background:#fafafa;margin:0;padding:0;}
    .header{background:#0066cc;color:#fff;padding:1rem;display:flex;justify-content:space-between;align-items:center;}
    .header h1{margin:0;font-size:1.2rem;}
    .container{max-width:800px;margin:auto;padding:2rem;}
    .btn{display:inline-block;margin:0.5rem 0;padding:0.8rem 1.2rem;background:#0066cc;color:#fff;border:none;border-radius:4px;text-decoration:none;cursor:pointer;}
    .logout{background:#d00;}
  </style>
</head>
<body>
  <div class="header">
    <h1>StuntBot – Dashboard</h1>
    <button class="logout" onclick="logout()">Keluar</button>
  </div>
  <div class="container">
    <p>Selamat datang! Pilih tindakan yang ingin Anda lakukan.</p>
    <a href="form.html" class="btn">📋 Input Data Stunting</a><br>
    <a href="view.html" class="btn">📊 Lihat 10 Data Terbaru</a>
  </div>
  <script>
    // Pastikan user sudah login (cek localStorage)
    if (localStorage.getItem('stuntbot_logged') !== 'true') {
      window.location.href = 'login.html';
    }
    function logout(){
      localStorage.removeItem('stuntbot_logged');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
