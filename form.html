<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Data Stunting – StuntBot</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:2rem;}
    .card{background:#fff;padding:1.5rem;border-radius:8px;max-width:500px;margin:auto;box-shadow:0 2px 6px rgba(0,0,0,.1);}
    h2{margin-top:0;text-align:center;}
    input,select{width:100%;padding:0.6rem;margin:0.4rem 0;border:1px solid #ccc;border-radius:4px;}
    button{background:#0066cc;color:#fff;border:none;padding:0.8rem 1rem;border-radius:4px;cursor:pointer;width:100%;}
    #msg{margin-top:1rem;color:#0066cc;}
  </style>
</head>
<body>
<div class="card">
  <h2>Input Data Stunting</h2>
  <form id="dataForm">
    <input name="nik"               placeholder="NIK (16 digit)" required />
    <input name="nama"              placeholder="Nama Lengkap" required />
    <input name="jenis_kelamin"     placeholder="Jenis Kelamin (L/P)" required />
    <input type="date" name="tanggal_lahir" placeholder="Tanggal Lahir" required />
    <input type="date" name="tanggal_ukur" placeholder="Tanggal Ukur" required />
    <input type="number" name="tinggi_cm" placeholder="Tinggi (cm)" required />
    <input name="posisi_ukur"       placeholder="Posisi Pengukuran" required />
    <input type="tel" name="hp"      placeholder="Nomor HP (contoh: 08123456789)" required />
    <label><input type="checkbox" name="isStunted"> Stunted?</label>
    <button type="submit">Kirim Data</button>
    <div id="msg"></div>
  </form>
</div>
<script>
  // Pastikan user sudah login
  if (localStorage.getItem('stuntbot_logged') !== 'true') {
    window.location.href = 'login.html';
  }

  const form = document.getElementById('dataForm');
  const msg  = document.getElementById('msg');

  // GANTI URL_DIBAWAH DENGAN URL WEB‑APP YANG ANDA DEPLOY
  const WEBAPP_URL = 'https://script.google.com/macros/s/YOUR_WEBAPP_ID/exec';

  form.addEventListener('submit', e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    data.isStunted = form.isStunted.checked; // checkbox → boolean

    fetch(WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(res => {
      if (res.status === 'ok') {
        msg.textContent = `✅ Data tersimpan (HP: ${res.hp})`;
        form.reset();
      } else {
        msg.textContent = `⚠️ ${res.message}`;
      }
    })
    .catch(err => { msg.textContent = '❌ Gagal mengirim data'; });
  });
</script>
</body>
</html>
